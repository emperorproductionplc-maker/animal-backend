0<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Adoption Center</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { width: 100%; margin: 10px 0; padding: 15px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
        .btn-msg { background: #4CAF50; color: white; }
        .btn-adopt { background: #2196F3; color: white; }
        .btn-donate { background: #FF9800; color: white; }
        input, textarea { display: block; margin: 10px auto; width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 Paws for Home</h1>
        <p>Helping our furry friends find forever families.</p>
        <input type="text" id="name" placeholder="Your Full Name">
        <input type="email" id="email" placeholder="Your Email">
        <textarea id="msg" rows="4" placeholder="How can we help?"></textarea>
        <button class="btn-msg" onclick="sendData('General Inquiry')">Send Message</button>
        <button class="btn-adopt" onclick="sendData('Adoption Request')">Apply to Adopt</button>
        <button class="btn-donate" onclick="sendData('Donation Interest')">I want to Donate</button>
    </div>
    <script>
        const BACKEND_URL = 'https://animal-backend-7roi.onrender.com';
        async function sendData(type) {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('msg').value;
            if(!name || !message) { alert('Please fill in your name and a message!'); return; }
            try {
                const response = await fetch(`${BACKEND_URL}/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, name, email, message })
                });
                if (response.ok) { alert('Success! Your request has been sent.'); }
                else { alert('Server error. Check your Render settings.'); }
            } catch (err) { alert('Could not connect to the server.'); }
        }
    </script>
</body>
</html>
